apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: 
  name: image-tag-should-not-be-empty
  namespace: kyverno
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains(':'))
      message: "Image should always contain a Tag or SHA"