apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: 
  name: prevent-latest-image-tags
  namespace: kyverno
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c, !c.image.endsWith(':latest'))
      message: "Image should never be deployed using Latest Tag"
