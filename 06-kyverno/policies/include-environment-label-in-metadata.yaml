apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: include-environment-label-in-metadata
  namespace: kyverno
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.metadata.labels.environment)
      message: "Specify Environment Label in Metadata"