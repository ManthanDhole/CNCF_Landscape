apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblockexec
spec:
  crd:
    spec:
      names:
        kind: K8sBlockExec
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblockexec

        violation[{"msg": msg}] {
          # Capture connection attempts to the exec path
          input.review.request.subResource == "exec"
          
          # Match standard interactive connection indicators
          # When using 'kubectl exec -it', stdin or tty evaluates to true
          (input.review.object.stdin == true) || (input.review.object.tty == true)
          
          msg := sprintf("Interactive execution into containers by user '%v' is blocked by OPA policy.", [input.review.request.userInfo.username])
        }
