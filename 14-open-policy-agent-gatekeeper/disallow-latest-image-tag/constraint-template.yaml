apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatest

        # Helper to get all containers from a Pod review
        containers[c] {
          c := input.review.object.spec.containers[_]
        }
        containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
        containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }

        # Check if the image uses the 'latest' tag or has no tag
        has_latest_tag(image) {
          endswith(image, ":latest")
        }

        has_latest_tag(image) {
          not contains(image, ":")
          not contains(image, "@")
        }

        # FIX: Changed 'deny' to 'violation' so Gatekeeper can ingest it
        violation[{"msg": msg}] {
          container := containers[_]
          has_latest_tag(container.image)
          msg := sprintf("Container '%v' is using an invalid image '%v'. The 'latest' tag is forbidden.", [container.name, container.image])
        }
